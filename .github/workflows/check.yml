# Checks every pull request and every push to main with tools/ci.sh - the tests, the linter, then one build that audits
# every page (`book audit`, tools/bookkit/audit.py) - run by tools/container.sh inside the image of tools/Dockerfile, the
# same command and the same image as on an author's machine. It fails on any error and on any warning
# tools/audit-baseline.json does not accept; the report, the contact sheets of the flagged pages and the PDF are
# uploaded as artifacts. On a pull request from a fork `audit` fails only on errors (the contributor's check) and
# `layout` (tools/layout_gate.py, the maintainer's check) fails on the layout warnings left: both are required for the
# merge, so main never turns red after one.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0              # the audit compares book/ with origin/main
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: tools
          tags: bookkit-build
          load: true
          cache-from: type=gha,scope=bookkit-build
          cache-to: type=gha,mode=max,scope=bookkit-build
      - name: Checks
        env:
          BOOKKIT_IMAGE: bookkit-build
          BASE: origin/main
          # a pull request from a fork: layout warnings are reported, not failed on (tools/ci.sh)
          ADVISORY: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
        run: tools/container.sh
      - name: Job summary
        if: always()
        run: if [ -f dist/ci/report.md ]; then cat dist/ci/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: agentic-sdlc-audit
          path: |
            dist/ci/report.md
            dist/ci/audit.json
            dist/ci/sheets/
            dist/ci/agentic-sdlc.pdf
          if-no-files-found: ignore

  layout:
    name: layout (maintainer)
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: tools/layout_gate.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v7.0.0
        with:
          name: agentic-sdlc-audit
          path: dist/ci
      - name: No layout warning left for main
        run: python3 tools/layout_gate.py dist/ci/audit.json
